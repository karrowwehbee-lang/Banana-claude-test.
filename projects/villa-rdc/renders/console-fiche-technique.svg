 text-anchor="middle" transform="rotate(-90 502.0 393.8)">1050</text><line x1="540.0" y1="820.0" x2="540.0" y2="525.0" stroke="#7a4a2a" stroke-width="1"/><line x1="534.0" y1="820.0" x2="546.0" y2="820.0" stroke="#7a4a2a"/><line x1="534.0" y1="525.0" x2="546.0" y2="525.0" stroke="#7a4a2a"/><text x="532.0" y="672.5" font-size="12" fill="#7a4a2a" font-family="Helvetica" text-anchor="middle" transform="rotate(-90 532.0 672.5)">1180</text><line x1="510.0" y1="262.5" x2="510.0" y2="120.0" stroke="#7a4a2a" stroke-width="1"/><line x1="504.0" y1="262.5" x2="516.0" y2="262.5" stroke="#7a4a2a"/><line x1="504.0" y1="120.0" x2="516.0" y2="120.0" stroke="#7a4a2a"/><text x="502.0" y="191.2" font-size="12" fill="#7a4a2a" font-family="Helvetica" text-anchor="middle" transform="rotate(-90 502.0 191.2)">570</text><text x="700.0" y="80.0" font-size="15" text-anchor="start" fill="#3a2f28" font-family="Georgia">COUPE A-A</text><rect x="670.0" y="120.0" width="30.0" height="700.0" fill="url(#hatch)" stroke="#2b2622"/><rect x="700.0" y="122.5" width="15.0" height="692.5" fill="#8a6a50" stroke="#2b2622"/><rect x="715.0" y="262.5" width="6.2" height="262.5" fill="#c9a46a" stroke="#2b2622"/><rect x="715.0" y="620.0" width="87.5" height="10.0" fill="#e4d6bf" stroke="#2b2622"/><rect x="715.0" y="630.0" width="80.0" height="35.0" fill="#7a5a44" stroke="#2b2622"/><rect x="726.2" y="630.0" width="65.0" height="190.0" fill="#e4d6bf" stroke="#2b2622" stroke-dasharray="4 3"/><path d="M685.0,667.5 L765.0,631.2" stroke="#1d1b19" stroke-width="2.5" stroke-dasharray="6 3"/><text x="667.5" y="671.5" font-size="11" text-anchor="end" fill="#1d1b19" font-family="Helvetica">équerre acier cachée</text><line x1="715.0" y1="590.0" x2="802.5" y2="590.0" stroke="#7a4a2a"/><text x="758.8" y="585.0" font-size="12" text-anchor="middle" fill="#7a4a2a" font-family="Helvetica">350</text><line x1="700.0" y1="108.0" x2="715.0" y2="108.0" stroke="#7a4a2a"/><text x="707.5" y="103.0" font-size="12" text-anchor="middle" fill="#7a4a2a" font-family="Helvetica">60</text><text x="840.0" y="80.0" font-size="15" text-anchor="start" fill="#3a2f28" font-family="Georgia">NOMENCLATURE</text><circle cx="849.0" cy="116" r="10" fill="#7a4a2a"/><text x="849.0" y="120.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">A</text><text x="868.0" y="120.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Habillage mural</text><text x="868.0" y="140.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Cannelures noyer massif ou plaqué, demi-ronds 30 mm, </text><text x="868.0" y="157.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">vernis mat 10 %. Ép. 60 mm. Joint creux 10 mm côté </text><text x="868.0" y="174.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">porte, plafond et sol. </text><circle cx="849.0" cy="202" r="10" fill="#7a4a2a"/><text x="849.0" y="206.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">B</text><text x="868.0" y="206.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Miroir arche</text><text x="868.0" y="226.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">620 × 1050, verre miroir bronze clair 6 mm, cadre </text><text x="868.0" y="243.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">laiton brossé 10 mm, LED halo 2700 K à l'arrière. </text><circle cx="849.0" cy="271" r="10" fill="#7a4a2a"/><text x="849.0" y="275.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">C</text><text x="868.0" y="275.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Plateau</text><text x="868.0" y="295.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Travertin Classico adouci, rebouché, 1200 × 350, </text><text x="868.0" y="312.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">chant 40 mm en onglet. Hauteur 800. </text><circle cx="849.0" cy="340" r="10" fill="#7a4a2a"/><text x="849.0" y="344.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">D</text><text x="868.0" y="344.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Tiroir suspendu</text><text x="868.0" y="364.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Noyer, 840 × 140, coulisses à sortie totale + </text><text x="868.0" y="381.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">ouverture par poussée, lèvre laiton (prise). </text><circle cx="849.0" cy="409" r="10" fill="#7a4a2a"/><text x="849.0" y="413.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">E</text><text x="868.0" y="413.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Pied sculptural</text><text x="868.0" y="433.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Colonne travertin plein Ø 260, H 760, collée et </text><text x="868.0" y="450.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">goujonnée sous le plateau. </text><circle cx="849.0" cy="478" r="10" fill="#7a4a2a"/><text x="849.0" y="482.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">F</text><text x="868.0" y="482.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Lumière</text><text x="868.0" y="502.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Ruban LED 2700 K IRC ≥ 90 sous le plateau, profilé </text><text x="868.0" y="519.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">diffusant, variateur. </text><circle cx="849.0" cy="547" r="10" fill="#7a4a2a"/><text x="849.0" y="551.0" font-size="11" text-anchor="middle" fill="#fff" font-family="Helvetica">G</text><text x="868.0" y="551.0" font-size="14" text-anchor="start" fill="#3a2f28" font-family="Georgia">Fixation</text><text x="868.0" y="571.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">Équerres acier noyées dans le mur (mur porteur ou </text><text x="868.0" y="588.0" font-size="12" text-anchor="start" fill="#6a5a4c" font-family="Helvetica">renfort à valider). </text><text x="120" y="915" font-family="Georgia" font-size="28" letter-spacing="7" fill="#2b2622">KAÏRA</text><text x="270" y="915" font-family="Helvetica" font-size="14" fill="#7a6a5c">Console LIGNE — mur habillé · fiche technique v1 · cotes en mm · à vérifier sur site</text></svg>