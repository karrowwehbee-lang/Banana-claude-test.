// ---------- procedural textures ----------
function rng(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvasTex(w, h, draw, repeat=[1,1], srgb=true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function oakDraw(base, seed){ return (g, w, h) => {
  const r = rng(seed);
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){
    const x = r()*w, lw = 0.5 + r()*2.5;
    const d = r() < 0.5 ? 0 : 255;
    g.strokeStyle = `rgba(${d? '120,95,72':'30,20,14'},${0.05 + r()*0.18})`;
    g.lineWidth = lw; g.beginPath(); g.moveTo(x,0);
    let xx = x; for (let y=0;y<=h;y+=h/8){ xx += (r()-0.5)*3; g.lineTo(xx,y); } g.stroke();
  }
  // ray flecks of quarter-cut oak
  for (let i=0;i<160;i++){ g.fillStyle=`rgba(140,112,86,${0.06+r()*0.1})`; g.fillRect(r()*w, r()*h, 1+r()*2, 8+r()*30); }
};}
const oakTex = canvasTex(1024, 1024, oakDraw('#5B4636', 7), [1,1]);
const floorTex = canvasTex(1024, 1024, (g,w,h)=>{
  const r = rng(11); const planks = 4; const pw = w/planks;
  for (let p=0;p<planks;p++){
    const tone = 92 + (r()-0.5)*16;
    g.fillStyle = `rgb(${tone+14},${tone-6},${tone-26})`; g.fillRect(p*pw,0,pw,h);
    for (let i=0;i<220;i++){ const x = p*pw + r()*pw; g.strokeStyle=`rgba(40,26,18,${0.03+r()*0.07})`; g.lineWidth=0.5+r()*2;
      g.beginPath(); g.moveTo(x,0); let xx=x; for(let y=0;y<=h;y+=h/10){xx+=(r()-0.5)*2.5; xx=Math.min(Math.max(xx,p*pw+1),p*pw+pw-1); g.lineTo(xx,y);} g.stroke(); }
    g.fillStyle='rgba(25,16,10,.9)'; g.fillRect(p*pw,0,2,h);
    const e = r()*h; g.fillRect(p*pw, e, pw, 2);
  }
}, [7.2/0.96, 9/4.0]);
function quartzDraw(seed){ return (g,w,h)=>{
  const r = rng(seed);
  const grd = g.createLinearGradient(0,0,w,h); grd.addColorStop(0,'#EDE3D3'); grd.addColorStop(.5,'#E5D8C3'); grd.addColorStop(1,'#EADFCD');
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  for (let i=0;i<40;i++){ g.fillStyle=`rgba(${r()<.5?'215,196,168':'245,238,226'},${0.15+r()*0.2})`; g.beginPath(); g.ellipse(r()*w,r()*h,40+r()*200,20+r()*80,r()*3,0,7); g.fill(); }
  g.filter = 'blur(2px)';
  for (let v=0; v<7; v++){
    const y0 = r()*h; const thick = v<2 ? 10+r()*14 : 1.5+r()*4;
    g.strokeStyle = v<2 ? `rgba(184,140,86,${0.35+r()*0.2})` : `rgba(150,112,72,${0.3+r()*0.35})`;
    g.lineWidth = thick; g.beginPath(); g.moveTo(-20,y0);
    let y=y0; for (let x=0;x<=w+40;x+=w/6){ y += (r()-0.45)*h*0.12; g.quadraticCurveTo(x-w/12, y+(r()-0.5)*60, x, y); }
    g.stroke();
  }
  g.filter='none';
  for (let v=0; v<14; v++){ const y0=r()*h; g.strokeStyle=`rgba(160,120,80,${0.15+r()*0.25})`; g.lineWidth=0.6+r(); g.beginPath(); g.moveTo(0,y0); let y=y0; for(let x=0;x<=w;x+=w/12){y+=(r()-0.5)*40; g.lineTo(x,y);} g.stroke(); }
};}
const quartzTex = canvasTex(2048, 1024, quartzDraw(5), [1,1]);
const plasterTex = canvasTex(512, 512, (g,w,h)=>{ const r=rng(3); g.fillStyle='#E9E1D5'; g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){ g.fillStyle=`rgba(${r()<.5?'255,252,246':'200,188,170'},${0.05+r()*0.08})`; g.beginPath(); g.ellipse(r()*w,r()*h,6+r()*50,4+r()*25,r()*3,0,7); g.fill(); } }, [3,2]);
const leatherTex = canvasTex(256,256,(g,w,h)=>{ const r=rng(9); g.fillStyle='#3E3029'; g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${r()<.5?'0,0,0':'120,95,80'},${r()*0.12})`; g.fillRect(r()*w,r()*h,1.5,1.5);} });
const skyTex = (top, mid, bot) => canvasTex(256, 512, (g,w,h)=>{ const grd=g.createLinearGradient(0,0,0,h); grd.addColorStop(0,top); grd.addColorStop(.55,mid); grd.addColorStop(1,bot); g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.filter='blur(6px)'; const r=rng(4); for(let i=0;i<70;i++){ g.fillStyle=`rgba(${70+r()*30},${80+r()*25},${55+r()*20},${0.25+r()*0.3})`; g.beginPath(); g.ellipse(r()*w, h*0.72+r()*h*0.12, 10+r()*22, 30+r()*50, 0, 0, 7); g.fill(); } g.filter='none'; });

function box(w,h,d, mat, x,y,z, opts={}){ // x,y,z = min corner
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x+w/2, y+h/2, z+d/2);
  m.castShadow = opts.cast !== false; m.receiveShadow = true;
  scene.add(m); return m;
}
// box with texture mapped in metres (so stone/oak keep real scale)
function tbox(w,h,d, mat, x,y,z, scale=[1,1], rot=false){
  const geo = new THREE.BoxGeometry(w,h,d);
  const uv = geo.attributes.uv, pos = geo.attributes.position, nrm = geo.attributes.normal;
  for (let i=0;i<uv.count;i++){
    const px=pos.getX(i)+x+w/2, py=pos.getY(i)+y+h/2, pz=pos.getZ(i)+z+d/2;
    const nx=Math.abs(nrm.getX(i)), ny=Math.abs(nrm.getY(i));
    let u,v; if (nx>0.5){u=pz;v=py;} else if (ny>0.5){u=px;v=pz;} else {u=px;v=py;}
    if (rot) [u,v]=[v,u];
    uv.setXY(i, u/scale[0], v/scale[1]);
  }
  const m = new THREE.Mesh(geo, mat); m.position.set(x+w/2,y+h/2,z+d/2);
  m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

{

{

// ---------- presets ----------
function setLights(p){
  sun.intensity = p.sun ?? 0; sun.color.set(p.sunColor ?? 0xffffff);
  const [sx,sy,sz] = p.sunPos ?? [-8,4,5]; sun.position.set(sx,sy,sz); sun.target.position.set(3,0,2.6);
  skyFill.intensity = p.skyFill ?? 0; skyFill.color.set(p.skyFillColor ?? 0xdfe6ee);
  scene.environmentIntensity = p.env ?? 0.3;
  M.sky.map = p.skyTex; M.sky.needsUpdate = true; M.sky.color.set(p.skyTint ?? 0xffffff);
  coves.forEach(c => c.intensity = p.cove ?? 0);
  spots.forEach(s => s.intensity = p.spots ?? 0);
  shelfLight.intensity = p.shelf ?? 0; nicheLight.intensity = p.niche ?? 0;
  shelfStrip.visible = (p.shelf ?? 0) > 0; nicheStrip.visible = (p.niche ?? 0) > 0;
  plinthLights.forEach(l => l.intensity = p.plinth ?? 0); plinthStrips.forEach(s => s.visible = (p.plinth ?? 0) > 0);
  pendantLights.forEach(({pl, up, domeIn}) => { pl.intensity = p.pend ?? 0; up.intensity = (p.pend ?? 0)*0.25; domeIn.material.emissiveIntensity = (p.pend ?? 0) > 0 ? 0.6 : 0; });
  M.alabaster.emissiveIntensity = (p.pend ?? 0) > 0 ? 1.4 : 0;
  officeLight.intensity = p.office ?? 0; officeStrip.visible = (p.office ?? 0) > 0;
  buildOffice(!!p.officeOpen);
  renderer.toneMappingExposure = p.exposure ?? 1;
}

const camera = new THREE.PerspectiveCamera(50, W/H, 0.05, 60);
camera.filmGauge = 36;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType }));

const gtao = new GTAOPass(scene, camera, W, H);
gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 1, scale: 1.1, samples: 16 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
composer.addPass(new OutputPass());

window.renderView = (id) => {
  const v = VIEWS[id];
  setLights(v.light);
  camera.position.set(...v.cam); camera.lookAt(...v.look); camera.setFocalLength(v.f);
  if (v.shift) camera.setViewOffset(W, H, 0, v.shift*H, W, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  composer.render();
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
